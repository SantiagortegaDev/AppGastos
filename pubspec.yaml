name: appgastos
description: "Registro rápido de gastos e ingresos con acceso desde Quick Settings."
publish_to: 'none'
version: 1.3.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  http: ^1.2.2
  fl_chart: ^0.68.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
