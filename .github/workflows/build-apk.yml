name: Build APK & Release

# Cada push a `main` dispara un build del APK y lo publica en GitHub Releases.
# Los tags `v*` (ej: v1.0.0) generan releases "estables"; el resto son prereleases.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:  # Permite dispararlo manualmente desde la UI.

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Necesario para crear releases y tags.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor (info)
        run: flutter doctor -v

      # Scaffold de archivos Android faltantes (gradle wrapper, settings.gradle.kts,
      # styles, mipmap icons, etc.). `flutter create .` NO sobreescribe archivos
      # existentes, así que nuestros MainActivity.kt, AndroidManifest.xml,
      # build.gradle.kts y lib/ se preservan.
      - name: Scaffold missing Android files
        run: flutter create . --org com.example --project-name appgastos

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Rename APK artifact
        id: artifact
        run: |
          mkdir -p artifacts
          # Tag push: nombre "AppGastos-<tag>.apk".
          # Push a main: nombre "AppGastos-build-<run_number>.apk".
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF##*/}"
            cp build/app/outputs/flutter-apk/app-release.apk "artifacts/AppGastos-${TAG}.apk"
            echo "name=${TAG}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "title=AppGastos ${TAG}" >> $GITHUB_OUTPUT
          else
            TAG="v1.0.${{ github.run_number }}"
            cp build/app/outputs/flutter-apk/app-release.apk "artifacts/AppGastos-${TAG}.apk"
            echo "name=${TAG}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "title=Build #${{ github.run_number }} (dev)" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact (GitHub Actions artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: AppGastos-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifact.outputs.name }}
          name: ${{ steps.artifact.outputs.title }}
          files: artifacts/*.apk
          prerelease: ${{ steps.artifact.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
